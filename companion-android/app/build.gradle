plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('CONNECTPHONE_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('CONNECTPHONE_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('CONNECTPHONE_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CONNECTPHONE_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.krsna016.connectphone.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.krsna016.connectphone.companion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
